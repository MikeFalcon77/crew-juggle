[package]
name = "juggle-shopping"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# PostgreSQL tests in tests/ (testcontainers); run them with `make test-integration`.
integration = []

[dependencies]
# Gear crates only for start order; code talks to their SDKs.
juggle-crews.workspace = true
juggle-crews-sdk.workspace = true
authz-resolver.workspace = true
authz-resolver-sdk.workspace = true
juggle-routines.workspace = true
juggle-routines-sdk.workspace = true
toolkit.workspace = true
toolkit-macros.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-db.workspace = true
toolkit-db-macros.workspace = true
toolkit-security.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
anyhow.workspace = true
async-trait.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
axum.workspace = true
http.workspace = true
utoipa = { version = "5", features = ["chrono", "uuid"] }
oagw.workspace = true
oagw-sdk.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
aws-lc-rs = "=1.18.2"
url = "2"
regex = "1"

[dev-dependencies]
juggle-testing.workspace = true
tower = { version = "0.5", features = ["util"] }
