apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crew-juggle.name" . }}-env
  labels: {{- include "crew-juggle.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "crew-juggle.databaseUrl" . | quote }}
  {{- if .Values.demo }}
  JUGGLE_DEMO_TIMEZONE: {{ .Values.demoTimezone | quote }}
  {{- else }}
  FIREBASE_PROJECT_ID: {{ required "firebaseProjectId is required when demo is false" .Values.firebaseProjectId | quote }}
  JUGGLE_ALLOWED_EMAILS: {{ .Values.allowedEmails | quote }}
  VAPID_PRIVATE_KEY: {{ required "vapid.privateKey is required when demo is false" .Values.vapid.privateKey | quote }}
  VAPID_PUBLIC_KEY: {{ required "vapid.publicKey is required when demo is false" .Values.vapid.publicKey | quote }}
  VAPID_SUBJECT: {{ .Values.vapid.subject | quote }}
  {{- end }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey | quote }}
  OPENAI_MODEL: {{ .Values.openai.model | quote }}
