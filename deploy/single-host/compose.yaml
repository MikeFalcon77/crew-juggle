# One server, real users: Postgres + crew-juggle + the web image (Caddy, automatic HTTPS).
#
#   cp .env.example .env   # fill in DOMAIN, FIREBASE_*, VAPID_*, POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Point your domain's DNS A record at the server first: Caddy asks Let's
# Encrypt for a certificate when it starts.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juggle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: juggle
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juggle"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: crew-juggle:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://juggle:${POSTGRES_PASSWORD}@db:5432/juggle
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
      JUGGLE_ALLOWED_EMAILS: ${JUGGLE_ALLOWED_EMAILS:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    expose:
      - "8080"

  # The web app and HTTPS: deploy/web/Caddyfile with your domain as the address.
  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    image: crew-juggle-web:local
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN in .env}
      API_UPSTREAM: app:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
