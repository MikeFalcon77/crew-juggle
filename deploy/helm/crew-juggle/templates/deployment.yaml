apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crew-juggle.name" . }}
  labels: {{- include "crew-juggle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "crew-juggle.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.demo }}
          args: ["--config", "/app/config/demo.yaml"]
          {{- end }}
          ports:
            - name: api
              containerPort: 8081
          env:
            # The web container takes :8080 in this pod.
            - name: APP__GEARS__API_GATEWAY__CONFIG__BIND_ADDR
              value: "0.0.0.0:8081"
          envFrom:
            - secretRef:
                name: {{ include "crew-juggle.name" . }}-env
          readinessProbe:
            httpGet: { path: /readyz, port: api }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /readyz, port: api }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
        # The web app; it passes API calls to the server in the same pod.
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: "127.0.0.1:8081"
            # Caddy keeps its state here; the image's default needs root.
            - name: XDG_DATA_HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.webResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
